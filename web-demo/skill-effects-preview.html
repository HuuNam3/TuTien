<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Skill Effects Preview</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0a0d14;
      --panel: #111725;
      --panel-2: #171f31;
      --line: #2b3955;
      --text: #edf3ff;
      --muted: #95a5c1;
      --accent: #65d9ff;
      --accent-2: #b58cff;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--text);
      background:
        radial-gradient(circle at 12% 0%, rgba(48, 112, 180, .2), transparent 32rem),
        radial-gradient(circle at 88% 12%, rgba(129, 69, 190, .16), transparent 30rem),
        var(--bg);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 4;
      border-bottom: 1px solid rgba(101, 217, 255, .18);
      background: rgba(10, 13, 20, .9);
      backdrop-filter: blur(16px);
    }

    .toolbar {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 18px 0 14px;
      display: flex;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: clamp(20px, 2.4vw, 32px);
      letter-spacing: -.03em;
    }

    .subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    button, select {
      color: var(--text);
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 9px;
      padding: 9px 12px;
      font: inherit;
      cursor: pointer;
    }

    button:hover, select:hover { border-color: var(--accent); }
    button:disabled { opacity: .45; cursor: default; }

    main {
      width: min(1440px, calc(100% - 32px));
      margin: 0 auto;
      padding: 22px 0 36px;
    }

    .status {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 14px;
    }

    .school-tabs {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .school-tab.active {
      color: #06111a;
      border-color: var(--accent);
      background: linear-gradient(135deg, var(--accent), #bceeff);
      box-shadow: 0 8px 20px rgba(101, 217, 255, .18);
    }

    .empty-state {
      grid-column: 1 / -1;
      padding: 52px 20px;
      color: var(--muted);
      text-align: center;
      border: 1px dashed var(--line);
      border-radius: 14px;
      background: rgba(17, 23, 37, .62);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
    }

    .card {
      min-width: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: linear-gradient(145deg, rgba(23, 31, 49, .94), rgba(13, 18, 30, .96));
      box-shadow: 0 12px 28px rgba(0, 0, 0, .22);
      cursor: zoom-in;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
    }

    .card:hover {
      transform: translateY(-2px);
      border-color: var(--accent);
      box-shadow: 0 16px 34px rgba(42, 168, 228, .17);
    }

    .stage {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      background-color: #080b12;
      background-image:
        linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%),
        linear-gradient(45deg, rgba(255,255,255,.025) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.025) 75%);
      background-position: 0 0, 8px 8px;
      background-size: 16px 16px;
    }

    .sprite {
      position: absolute;
      inset: 5%;
      width: 90%;
      height: 90%;
      display: block;
      image-rendering: auto;
      filter: drop-shadow(0 0 9px rgba(72, 214, 255, .18));
    }

    .frame-number {
      position: absolute;
      right: 8px;
      top: 8px;
      padding: 3px 6px;
      border-radius: 6px;
      color: #d9e8ff;
      background: rgba(4, 7, 13, .68);
      font: 11px ui-monospace, SFMono-Regular, Consolas, monospace;
    }

    .caption {
      padding: 11px 12px 13px;
    }

    .caption strong {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
    }

    .caption span {
      display: block;
      margin-top: 4px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: var(--muted);
      font-size: 11px;
    }

    .pagination {
      display: flex;
      gap: 10px;
      align-items: center;
      justify-content: center;
      margin-top: 22px;
    }

    .page-label { min-width: 120px; text-align: center; color: var(--muted); font-size: 13px; }

    dialog {
      width: min(760px, calc(100% - 28px));
      padding: 0;
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 16px;
      background: #0b101b;
      box-shadow: 0 24px 80px rgba(0, 0, 0, .7);
    }

    dialog::backdrop { background: rgba(2, 5, 10, .78); backdrop-filter: blur(5px); }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }

    .modal-head strong { font-size: 15px; }
    .modal-head span { display: block; margin-top: 3px; color: var(--muted); font-size: 12px; }

    .modal-stage {
      position: relative;
      width: min(680px, 92vw);
      aspect-ratio: 1;
      margin: 20px auto 24px;
      overflow: hidden;
      background-color: #080b12;
      background-image:
        linear-gradient(45deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.03) 75%),
        linear-gradient(45deg, rgba(255,255,255,.03) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.03) 75%);
      background-position: 0 0, 24px 24px;
      background-size: 48px 48px;
    }

    .modal-sprite { position: absolute; inset: 2%; width: 96%; height: 96%; display: block; filter: drop-shadow(0 0 20px rgba(72, 214, 255, .22)); }

    @media (max-width: 980px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
    @media (max-width: 680px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; } main, .toolbar { width: min(100% - 20px, 1440px); } }
    @media (max-width: 400px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header>
    <div class="toolbar">
      <div>
        <h1>Skill Effects Preview</h1>
        <p class="subtitle">Mỗi ô là một sprite animation 4×4 tự động chạy lặp. Bấm “Tạm dừng” để xem đứng yên hoặc bấm ô để phóng to.</p>
      </div>
      <div class="controls">
        <button id="playToggle" type="button">Tạm dừng</button>
        <label for="speed">Tốc độ</label>
        <select id="speed" aria-label="Tốc độ animation">
          <option value="125">8 FPS</option>
          <option value="100" selected>10 FPS</option>
          <option value="66.6667">15 FPS</option>
          <option value="50">20 FPS</option>
        </select>
      </div>
    </div>
  </header>

  <main>
    <div class="status"><span id="count"></span><span>Premium effects only · Sheet gốc: 1254×1254 · 16 frame</span></div>
    <div id="schoolTabs" class="school-tabs" role="tablist" aria-label="Chọn phái"></div>
    <section id="grid" class="grid" aria-live="polite"></section>
    <nav class="pagination" aria-label="Phân trang">
      <button id="prev" type="button">← Trang trước</button>
      <span id="pageLabel" class="page-label"></span>
      <button id="next" type="button">Trang sau →</button>
    </nav>
  </main>

  <dialog id="viewer">
    <div class="modal-head">
      <div><strong id="modalTitle"></strong><span id="modalMeta"></span></div>
      <button id="closeViewer" type="button">Đóng</button>
    </div>
    <div class="modal-stage"><canvas id="modalSprite" class="modal-sprite" width="640" height="640"></canvas><span id="modalFrame" class="frame-number">Frame 01/16</span></div>
  </dialog>

  <script>
    const assetBase = '/assets/Art/Sprites/Effects/';
    const assetVersion = 'blade-khaithien-dao-v5';
    const schoolAssets = {
      sword: {
        label: 'Kiếm Tu',
        assets: [
          ['skill-beginner-sword-art-sheet-premium.png', 'Ngự Kiếm Quyết · premium'],
          ['skill-sword-quickdraw-sheet-premium.png', 'Khoái Kiếm Liên Tâm · premium'],
          ['skill-sword-flash-sheet-premium.png', 'Phá Không Kiếm · premium'],
          ['skill-sword-flow-sheet-premium.png', 'Lưu Quang Kiếm Ảnh · premium'],
          ['skill-sword-domain-sheet-premium.png', 'Vạn Kiếm Quy Tông · premium'],
          ['skill-sword-storm-sheet-premium.png', 'Kiếm Vũ Lưu Tinh · premium'],
          ['skill-sword-earth-rift-sheet-premium.png', 'Thiên Liệt Kiếm Ảnh · premium'],
          ['skill-sword-earth-lotus-sheet-premium.png', 'Cửu Liên Kiếm Trận · premium'],
          ['skill-sword-heaven-starfall-sheet-premium.png', 'Thiên Hà Kiếm Vũ · premium'],
          ['skill-sword-heaven-realm-sheet-premium.png', 'Vạn Cổ Kiếm Tôn · premium'],
        ],
      },
      blade: {
        label: 'Đao Tu',
        assets: [
          ['skill-blade-beginner-art-sheet-premium.png', 'Truy Phong Nhất Trảm · premium'],
          ['skill-blade-heavy-sheet-premium.png', 'Trọng Sơn Phách · premium'],
          ['skill-blade-blood-sheet-premium.png', 'Huyết Nguyệt Trảm · premium'],
          ['skill-blade-rend-sheet-premium.png', 'Liệt Địa Phá Quân · premium'],
          ['skill-blade-heaven-sheet-premium.png', 'Bá Đao Trấn Nhạc · premium'],
          ['skill-blade-apocalypse-sheet-premium.png', 'Cuồng Đao Liệt Không · premium'],
          ['skill-blade-earth-sunder-sheet-premium.png', 'Thiên Quân Đoạn Nhạc · premium'],
          ['skill-blade-earth-warcry-sheet-premium.png', 'Vạn Nhận Phá Trận · premium'],
          ['skill-blade-heaven-overlord-sheet-premium.png', 'Hoang Cổ Bá Đao · premium'],
          ['skill-blade-heaven-worldsplitter-sheet-premium.png', 'Khai Thiên Nhất Đao · premium'],
        ],
      },
    };
    const pageSize = 16;
    let page = 0;
    const requestedSchool = new URLSearchParams(location.search).get('school');
    let school = requestedSchool === 'blade' ? 'blade' : 'sword';
    let playing = true;
    let frameMs = 100;
    let lastTick = 0;
    let frame = 0;
    let modalItem = null;
    let modalSchool = null;
    const sheetCache = new Map();

    const grid = document.querySelector('#grid');
    const count = document.querySelector('#count');
    const schoolTabs = document.querySelector('#schoolTabs');
    const pageLabel = document.querySelector('#pageLabel');
    const prev = document.querySelector('#prev');
    const next = document.querySelector('#next');
    const playToggle = document.querySelector('#playToggle');
    const speed = document.querySelector('#speed');
    const viewer = document.querySelector('#viewer');
    const modalSprite = document.querySelector('#modalSprite');
    const modalFrame = document.querySelector('#modalFrame');

    function activeSchool() {
      return schoolAssets[school];
    }

    function renderTabs() {
      schoolTabs.replaceChildren();
      Object.entries(schoolAssets).forEach(([id, value]) => {
        const button = document.createElement('button');
        button.type = 'button';
        button.className = `school-tab${id === school ? ' active' : ''}`;
        button.setAttribute('role', 'tab');
        button.setAttribute('aria-selected', String(id === school));
        button.textContent = `${value.label} (${value.assets.length})`;
        button.addEventListener('click', () => { school = id; page = 0; renderTabs(); renderPage(); });
        schoolTabs.append(button);
      });
    }

    function renderPage() {
      const currentAssets = activeSchool().assets;
      const start = page * pageSize;
      const visible = currentAssets.slice(start, start + pageSize);
      grid.replaceChildren();
      if (visible.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'empty-state';
        empty.textContent = `Chưa có premium effect cho ${activeSchool().label}.`;
        grid.append(empty);
      }
      visible.forEach(([file, label], offset) => {
        const index = start + offset;
        const card = document.createElement('article');
        card.className = 'card';
        card.dataset.index = index;
        card.innerHTML = `
          <div class="stage">
            <canvas class="sprite" width="314" height="314" data-school="${school}" data-asset-index="${index}" aria-label="${label}"></canvas>
            <span class="frame-number">Frame 01/16</span>
          </div>
          <div class="caption"><strong>${label}</strong><span>${file}</span></div>`;
        card.addEventListener('click', () => openViewer(index));
        grid.append(card);
        loadSheet(school, index).then(updateAllFrames);
      });
      count.textContent = `${activeSchool().label} · ${currentAssets.length} sprite · đang xem ${currentAssets.length ? `${start + 1}–${Math.min(start + pageSize, currentAssets.length)}` : '0'}`;
      pageLabel.textContent = `Trang ${currentAssets.length ? page + 1 : 0} / ${Math.max(1, Math.ceil(currentAssets.length / pageSize))}`;
      prev.disabled = page === 0;
      next.disabled = start + pageSize >= currentAssets.length;
      updateAllFrames();
    }

    function updateAllFrames() {
      document.querySelectorAll('.sprite').forEach((element) => drawFrame(element, element.dataset.school, Number(element.dataset.assetIndex), frame));
      document.querySelectorAll('.stage .frame-number').forEach((element) => { element.textContent = `Frame ${String(frame + 1).padStart(2, '0')}/16`; });
      if (modalItem !== null) {
        drawFrame(modalSprite, modalSchool, modalItem, frame);
        modalFrame.textContent = `Frame ${String(frame + 1).padStart(2, '0')}/16`;
      }
    }

    function openViewer(index) {
      modalItem = index;
      modalSchool = school;
      const [file, label] = activeSchool().assets[index];
      document.querySelector('#modalTitle').textContent = label;
      document.querySelector('#modalMeta').textContent = `${file} · 16 frame · loop`;
      modalSprite.dataset.school = school;
      modalSprite.dataset.assetIndex = index;
      loadSheet(school, index).then(() => drawFrame(modalSprite, school, index, frame));
      updateAllFrames();
      viewer.showModal();
    }

    document.querySelector('#closeViewer').addEventListener('click', () => viewer.close());
    viewer.addEventListener('click', (event) => { if (event.target === viewer) viewer.close(); });
    prev.addEventListener('click', () => { page -= 1; renderPage(); });
    next.addEventListener('click', () => { page += 1; renderPage(); });
    playToggle.addEventListener('click', () => { playing = !playing; playToggle.textContent = playing ? 'Tạm dừng' : 'Chạy animation'; });
    speed.addEventListener('change', () => { frameMs = Number(speed.value); });

    function loadSheet(schoolId, index) {
      const cacheKey = `${schoolId}:${index}`;
      if (sheetCache.has(cacheKey)) return sheetCache.get(cacheKey);
      const promise = new Promise((resolve, reject) => {
        const image = new Image();
        image.decoding = 'async';
        image.onload = () => {
          const source = document.createElement('canvas');
          source.width = image.naturalWidth;
          source.height = image.naturalHeight;
          const context = source.getContext('2d', { willReadFrequently: true });
          context.drawImage(image, 0, 0);
          const frames = [];
          let maxWidth = 0;
          let maxHeight = 0;
          for (let frameIndex = 0; frameIndex < 16; frameIndex += 1) {
            const column = frameIndex % 4;
            const row = Math.floor(frameIndex / 4);
            const sx = Math.round(column * source.width / 4);
            const sy = Math.round(row * source.height / 4);
            const ex = Math.round((column + 1) * source.width / 4);
            const ey = Math.round((row + 1) * source.height / 4);
            const width = ex - sx;
            const height = ey - sy;
            const pixels = context.getImageData(sx, sy, width, height).data;
            let left = width;
            let top = height;
            let right = -1;
            let bottom = -1;
            for (let y = 0; y < height; y += 1) {
              for (let x = 0; x < width; x += 1) {
                if (pixels[(y * width + x) * 4 + 3] > 8) {
                  left = Math.min(left, x);
                  top = Math.min(top, y);
                  right = Math.max(right, x);
                  bottom = Math.max(bottom, y);
                }
              }
            }
            const bounds = right < 0 ? { x: 0, y: 0, width: 1, height: 1 } : { x: left, y: top, width: right - left + 1, height: bottom - top + 1 };
            maxWidth = Math.max(maxWidth, bounds.width);
            maxHeight = Math.max(maxHeight, bounds.height);
            frames.push({ sx, sy, ...bounds });
          }
          const sheet = { image, frames, maxWidth, maxHeight };
          sheetCache.set(cacheKey, sheet);
          resolve(sheet);
        };
        image.onerror = reject;
        image.src = `${assetBase}${encodeURIComponent(schoolAssets[schoolId].assets[index][0])}?v=${assetVersion}`;
      });
      sheetCache.set(cacheKey, promise);
      return promise;
    }

    function drawFrame(canvas, schoolId, index, frameIndex) {
      if (!canvas || !schoolAssets[schoolId] || Number.isNaN(index)) return;
      const cached = sheetCache.get(`${schoolId}:${index}`);
      if (!cached || typeof cached.then === 'function') return;
      const frameData = cached.frames[frameIndex];
      const context = canvas.getContext('2d');
      context.clearRect(0, 0, canvas.width, canvas.height);
      if (!frameData) return;
      const scale = Math.min((canvas.width * .9) / cached.maxWidth, (canvas.height * .9) / cached.maxHeight);
      const width = Math.max(1, Math.round(frameData.width * scale));
      const height = Math.max(1, Math.round(frameData.height * scale));
      const x = Math.round((canvas.width - width) / 2);
      const y = Math.round((canvas.height - height) / 2);
      context.drawImage(cached.image, frameData.sx + frameData.x, frameData.sy + frameData.y, frameData.width, frameData.height, x, y, width, height);
    }

    function loop(timestamp) {
      if (playing && timestamp - lastTick >= frameMs) {
        frame = (frame + 1) % 16;
        lastTick = timestamp;
        updateAllFrames();
      }
      requestAnimationFrame(loop);
    }

    renderTabs();
    renderPage();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
